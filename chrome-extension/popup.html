<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Resume Optimizer</title>
    <link rel="stylesheet" href="popup.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
</head>

<body>
    <div class="container">
        <span id="history" class="back-icon hidden material-symbols-outlined">arrow_back</span>

        <div id="header" class="header-container">
            <h2>AI Resume Optimizer</h2>
            <div class="header-actions">
                <span id="showLoginForm" class="settings-icon material-symbols-outlined" title="Login">account_circle</span>
                <span id="showAISettingsForm" class="settings-icon material-symbols-outlined" title="AI Settings">settings</span>
            </div>
        </div>

        <!-- AI Settings Form -->
        <section id="AISettingsForm" class="hidden">
            <div class="input-field">
                <label for="aiModel">Select AI Model</label>
                <select id="aiModel">
                    <option value="gemini" selected>Gemini</option>
                    <option value="gpt">GPT</option>
                    <option value="claude">Claude</option>
                </select>
            </div>

            <div class="input-field">
                <label for="userToken">AI API Key</label>
                <input id="userToken" type="password" placeholder="Enter AI token">
            </div>

            <button class="btn grey" id="saveAISettings">Save</button>
        </section>

        <!-- Login Form -->
        <section id="LoginForm" class="hidden">
            <div id="loginSection">
                <div class="input-field">
                    <label for="loginEmail">Email</label>
                    <input id="loginEmail" type="email" placeholder="Enter your email">
                </div>

                <div class="input-field">
                    <label for="loginPassword">Password</label>
                    <input id="loginPassword" type="password" placeholder="Enter your password">
                </div>

                <button class="btn" id="loginBtn">Login</button>
                
                <div class="divider">
                    <span>or</span>
                </div>
                
                <div id="googleSignInBtn" class="google-signin-btn"></div>
                
                <button class="btn grey" id="showSignupForm">Sign Up</button>
            </div>

            <div id="signupSection" class="hidden">
                <div class="input-field">
                    <label for="signupName">Name</label>
                    <input id="signupName" type="text" placeholder="Enter your name">
                </div>

                <div class="input-field">
                    <label for="signupEmail">Email</label>
                    <input id="signupEmail" type="email" placeholder="Enter your email">
                </div>

                <div class="input-field">
                    <label for="signupPassword">Password</label>
                    <input id="signupPassword" type="password" placeholder="Enter your password">
                </div>

                <button class="btn" id="signupBtn">Sign Up</button>
                <button class="btn grey" id="backToLogin">Back to Login</button>
            </div>

            <div id="userProfile" class="hidden">
                <p>Welcome, <span id="userName"></span>!</p>
                <button class="btn grey" id="logoutBtn">Logout</button>
            </div>
        </section>

        <!-- Resume Upload Section -->
        <section id="MainForm">
            <div class="input-field">
                <label for="resumeFile">Upload Resume</label>
                <input type="file" id="resumeFile" accept=".pdf, .docx, .txt" />
            </div>

            <div class="input-field">
                <label for="resume">Parsed Resume Content</label>
                <textarea id="resume" placeholder="Your resume content will appear here" rows="6" readonly></textarea>
            </div>

            <div class="input-field">
                <label for="jobDescription">Paste Job Description</label>
                <textarea id="jobDescription" placeholder="Enter job description" rows="6"></textarea>
            </div>

            <div class="ats-container">
                <button class="btn" id="optimizeResume">Optimize Resume</button>
                <div class="loader hidden" id="loader"></div>
            </div>

        </section>

        <!-- Job Saving Form -->
        <section id="JobSaveForm" class="hidden">
            <h3>Save Job to Dashboard</h3>
            <div class="input-field">
                <label for="jobCompany">Company</label>
                <input id="jobCompany" type="text" placeholder="Company name">
            </div>

            <div class="input-field">
                <label for="jobPosition">Position</label>
                <input id="jobPosition" type="text" placeholder="Job position">
            </div>

            <div class="input-field">
                <label for="jobUrl">Job URL (optional)</label>
                <input id="jobUrl" type="url" placeholder="https://...">
            </div>

            <div class="input-field">
                <label for="jobDescriptionSave">Job Description</label>
                <textarea id="jobDescriptionSave" placeholder="Job description will be auto-filled" rows="6"></textarea>
            </div>

            <div class="ats-container">
                <button class="btn" id="saveJobBtn">Save Job</button>
                <button class="btn grey" id="cancelSaveJob">Cancel</button>
            </div>
        </section>

        <section id="atsScore" class="ats-score-container hidden">
            <div class="progress-container">
                <svg class="progress-ring" width="120" height="120">
                    <circle class="progress-background" cx="60" cy="60" r="50" />
                    <circle class="progress-circle" cx="60" cy="60" r="50" />
                </svg>
                <div class="progress-text">0/100</div>
            </div>
        </section>
    </div>

    <!-- Message Box Container -->
    <div id="messageBox"></div>

    <script src="./libs/pdf.min.js"></script>
    <script src="./libs/mammoth.browser.min.js"></script>
    <script src="./libs/docx.min.js"></script>
    <script src="./libs/docGenerator.js"></script>
    <script src="popup.js"></script>
</body>

</html>
