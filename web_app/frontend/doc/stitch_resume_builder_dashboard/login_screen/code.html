<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login - AI Resume Builder</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">

            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2463eb",
                        "background-light": "#f6f6f8",
                        "background-dark": "#111621",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark min-h-screen flex flex-col font-display">
<!-- Navigation Header (Modified from Component List) -->
<header class="flex items-center justify-between whitespace-nowrap border-b border-solid border-[#e7ebf3] dark:border-slate-800 px-6 py-3 bg-white dark:bg-background-dark">
<div class="flex items-center gap-4 text-primary">
<div class="size-8">
<svg fill="none" viewbox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
<g clip-path="url(#clip0_6_330)">
<path clip-rule="evenodd" d="M24 0.757355L47.2426 24L24 47.2426L0.757355 24L24 0.757355ZM21 35.7574V12.2426L9.24264 24L21 35.7574Z" fill="currentColor" fill-rule="evenodd"></path>
</g>
<defs>
<clippath id="clip0_6_330"><rect fill="white" height="48" width="48"></rect></clippath>
</defs>
</svg>
</div>
<h2 class="text-[#0e121b] dark:text-white text-lg font-bold leading-tight tracking-[-0.015em]">AI Resume Builder</h2>
</div>
<div class="flex items-center gap-4">
<span class="text-sm text-slate-500 dark:text-slate-400 hidden sm:block">Need help?</span>
<button class="flex min-w-[84px] cursor-pointer items-center justify-center rounded-lg h-10 px-4 bg-primary text-white text-sm font-bold">
                Sign up
            </button>
</div>
</header>
<!-- Main Content Area -->
<main class="flex-1 flex items-center justify-center p-4 sm:p-6 lg:p-8">
<div class="w-full max-w-[440px] bg-white dark:bg-[#1a2133] rounded-xl shadow-sm border border-slate-200 dark:border-slate-800 overflow-hidden">
<div class="p-8 sm:p-10 flex flex-col items-center">
<!-- Brand Icon -->
<div class="mb-6 p-3 bg-primary/10 rounded-full">
<span class="material-symbols-outlined text-primary text-3xl">auto_awesome</span>
</div>
<!-- HeadlineText Component -->
<h1 class="text-[#0e121b] dark:text-white tracking-light text-[32px] font-bold leading-tight text-center pb-2">Welcome back</h1>
<!-- BodyText Component -->
<p class="text-slate-500 dark:text-slate-400 text-base font-normal leading-normal pb-8 text-center">Log in to your account to continue</p>
<!-- Form Fields -->
<form class="w-full space-y-5">
<!-- TextField (Email) -->
<div class="flex flex-col w-full">
<label class="flex flex-col w-full">
<p class="text-[#0e121b] dark:text-slate-200 text-sm font-semibold leading-normal pb-2">Email Address</p>
<input class="form-input flex w-full rounded-lg text-[#0e121b] dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/20 border border-[#d0d7e7] dark:border-slate-700 bg-transparent focus:border-primary h-12 placeholder:text-slate-400 p-[15px] text-base font-normal" placeholder="Enter your email" type="email" value=""/>
</label>
</div>
<!-- TextField (Password) -->
<div class="flex flex-col w-full">
<div class="flex justify-between items-end pb-2">
<p class="text-[#0e121b] dark:text-slate-200 text-sm font-semibold leading-normal">Password</p>
<a class="text-sm font-medium text-primary hover:underline" href="#">Forgot password?</a>
</div>
<label class="flex w-full items-stretch rounded-lg">
<input class="form-input flex w-full min-w-0 flex-1 rounded-lg rounded-r-none text-[#0e121b] dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/20 border border-[#d0d7e7] dark:border-slate-700 bg-transparent focus:border-primary h-12 placeholder:text-slate-400 p-[15px] border-r-0 pr-2 text-base font-normal" placeholder="Enter your password" type="password" value=""/>
<div class="text-slate-400 dark:text-slate-500 flex border border-[#d0d7e7] dark:border-slate-700 bg-transparent items-center justify-center px-3 rounded-r-lg border-l-0">
<span class="material-symbols-outlined text-[20px] cursor-pointer hover:text-primary">visibility</span>
</div>
</label>
</div>
<!-- Login Button -->
<button class="w-full bg-primary hover:bg-blue-700 text-white font-bold h-12 rounded-lg transition-colors flex items-center justify-center gap-2" type="submit">
<span>Log In</span>
</button>
<!-- Divider -->
<div class="relative py-4">
<div aria-hidden="true" class="absolute inset-0 flex items-center">
<div class="w-full border-t border-slate-200 dark:border-slate-800"></div>
</div>
<div class="relative flex justify-center text-xs uppercase">
<span class="bg-white dark:bg-[#1a2133] px-2 text-slate-500 font-medium">Or continue with</span>
</div>
</div>
<!-- OAuth Button -->
<button class="w-full flex items-center justify-center gap-3 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 h-12 rounded-lg hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors" type="button">
<img alt="" class="w-5 h-5" data-alt="Google colorful logo" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBxgqgIXWmGEOC_F31_ibmYJK1WUZHCBZenq1MmBtNebZ7RBm_lXAQbltYnWWYZ5-oXoQtq4npZtbDW5eiqbmfLk4pwwOMU4CzmQwWp3nwPZVpjLyYx9UTgksI6rLvoUp9_mSVmJICJVXkGzlCz1aQTQsog58QIxcMD0fOkX4b8JTfsEJBWIiyAgH8qtowARtTh5kARVQtus-9StFeE9B7rW9tVrdJlcYWLzswG7tq-VqQwv_8DsAdN4_raHdHmLINsA1oRLi7nj7M"/>
<span class="text-slate-700 dark:text-slate-200 font-semibold text-sm">Continue with Google</span>
</button>
</form>
<!-- Footer Text -->
<div class="mt-8 text-center">
<p class="text-sm text-slate-500 dark:text-slate-400">
                        Don't have an account? 
                        <a class="text-primary font-bold hover:underline" href="#">Sign up</a>
</p>
</div>
</div>
<!-- Card Bottom Bar (Subtle decoration) -->
<div class="h-1 bg-primary"></div>
</div>
</main>
<!-- Footer Meta -->
<footer class="py-6 text-center text-xs text-slate-400 dark:text-slate-600">
<p>© 2024 AI Resume Builder. All rights reserved.</p>
<div class="flex justify-center gap-4 mt-2">
<a class="hover:text-primary" href="#">Terms of Service</a>
<a class="hover:text-primary" href="#">Privacy Policy</a>
</div>
</footer>
</body></html>
