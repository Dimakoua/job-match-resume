<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

                },
            },
        }

</head>
<body class="bg-background-light dark:bg-background-dark font-display min-h-screen flex flex-col">
<!-- Top Navigation Bar -->
<header class="flex items-center justify-between whitespace-nowrap border-b border-solid border-b-[#e7ebf3] dark:border-b-slate-800 px-10 py-3 bg-white dark:bg-background-dark">
<div class="flex items-center gap-4 text-[#0e121b] dark:text-white">
<div class="size-6 text-primary">
<svg fill="none" viewbox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
<g clip-path="url(#clip0_6_330)">
<path clip-rule="evenodd" d="M24 0.757355L47.2426 24L24 47.2426L0.757355 24L24 47.2426ZM21 35.7574V12.2426L9.24264 24L21 35.7574Z" fill="currentColor" fill-rule="evenodd"></path>
</g>
<defs>

</svg>

<h2 class="text-lg font-bold leading-tight tracking-[-0.015em]">AI Resume Builder</h2>
</div>

<!-- Main Content Area -->
<main class="flex-1 flex items-center justify-center p-6">
<div class="w-full max-w-[440px] bg-white dark:bg-slate-900 shadow-xl rounded-xl border border-[#e7ebf3] dark:border-slate-800 p-8 flex flex-col gap-6">
<!-- Icon and Header Section -->
<div class="flex flex-col items-center text-center">
<div class="size-14 bg-primary/10 rounded-full flex items-center justify-center mb-4">
<span class="material-symbols-outlined text-primary text-3xl">key</span>
</div>
<h1 class="text-[#0e121b] dark:text-white tracking-tight text-[32px] font-bold leading-tight">Forgot password?</h1>
<p class="text-[#4d6599] dark:text-slate-400 text-base font-normal leading-normal mt-2">
                    No worries, we'll send you reset instructions.
                </p>
</div>
<!-- Form Section -->
<form class="flex flex-col gap-4">
<div class="flex flex-col gap-2">
<label class="flex flex-col w-full">
<p class="text-[#0e121b] dark:text-slate-200 text-sm font-semibold leading-normal pb-2">Email address</p>
<input class="form-input flex w-full rounded-lg text-[#0e121b] dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/20 border border-[#d0d7e7] dark:border-slate-700 bg-white dark:bg-slate-800 focus:border-primary h-12 placeholder:text-[#4d6599] dark:placeholder:text-slate-500 px-4 text-base font-normal leading-normal transition-all" placeholder="name@company.com" required="" type="email"/>
</label>
</div>
<div class="flex flex-col pt-2">
<button class="flex w-full cursor-pointer items-center justify-center overflow-hidden rounded-lg h-12 px-5 bg-primary hover:bg-primary/90 text-white text-base font-bold leading-normal tracking-[0.015em] shadow-sm transition-colors" type="submit">
<span class="truncate">Reset password</span>
</button>
</div>
</form>
<!-- Navigation Back Link -->
<div class="flex justify-center mt-2">
<a class="group flex items-center gap-2 text-sm font-semibold text-[#4d6599] dark:text-slate-400 hover:text-primary dark:hover:text-primary transition-colors" href="#">
<span class="material-symbols-outlined text-[18px] transition-transform group-hover:-translate-x-1">arrow_back</span>
                    Back to login
                </a>
</div>
</div>
</main>
<!-- Footer for visual balance -->
<footer class="py-6 px-10 border-t border-solid border-b-[#e7ebf3] dark:border-t-slate-800 text-center">
