name = "resume-builder-backend"
main = "src/router.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[env.development]
vars = { JWT_SECRET = "dev-secret-key-change-in-production", GEMINI_API_KEY = "your-development-gemini-api-key" }

[[env.development.d1_databases]]
binding = "DB"
database_name = "resume-builder-dev"
database_id = "local-resume-builder"
preview_database_id = "local-resume-builder" # Use same for preview

[env.test]
vars = { JWT_SECRET = "test-secret-key", GEMINI_API_KEY = "test-gemini-key" }

[[env.test.d1_databases]]
binding = "DB"
database_name = "resume-builder-test"
database_id = "local-test-resume-builder"

# --- Environment: Production ---
# Configuration for `wrangler deploy`.

[env.production]
vars = { JWT_SECRET = "your-production-jwt-secret", GEMINI_API_KEY = "your-production-gemini-api-key" }

# IMPORTANT: Replace with your actual production database ID.
[[env.production.d1_databases]]
binding = "DB"
database_name = "resume-builder-prod"
database_id = "your-production-database-id"
